<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup Contact Sheet</title>
<!-- Visual check of the setup scanner (js/core/scanner.js): every setup findSetups() detects in the
     market fixtures (tests/fixtures/market, mock mode — no network), drawn the way lessons show them
     (lesson-kit annotateSetup) with the 20 candles after the decision. Serve the repo root and open
     /tests/visual/setups.html
     Query: ?kind=<setupKind>[,<kind>]  ?group=candle|trend|level|ma|momentum|fib|chart
            ?symbol=SPY  ?interval=1d|1w  ?per=6 (max charts per kind)  ?sim=1 (simRound instead of
            fixtures)  ?theme=dark|light  ?after=20 -->
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/chart.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 var(--font-body, system-ui, sans-serif);
    padding: 20px max(16px, env(safe-area-inset-left));
  }
  h1 { font: 700 26px/1.2 var(--font-display, system-ui, sans-serif); margin: 0 0 4px; text-wrap: balance; }
  h2 { font: 700 19px/1.2 var(--font-display, system-ui, sans-serif); margin: 28px 0 4px; }
  .lead { color: var(--text-2); margin: 0 0 12px; max-width: 900px; }
  .rule { color: var(--text-3); margin: 0 0 10px; max-width: 900px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius, 10px); padding: 10px 10px 6px; min-width: 0; }
  .card h3 { font: 600 13px/1.3 var(--font-mono, ui-monospace, monospace); margin: 0 0 6px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .card h3 b { color: var(--text); }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); }
  .tag.up { color: var(--bull); } .tag.down { color: var(--bear); } .tag.flat { color: var(--text-3); }
  .stats { font: 12px/1.4 var(--font-mono, ui-monospace, monospace); color: var(--text-3); margin: 4px 0 0; }
  .empty { color: var(--text-3); font-style: italic; }
  table { border-collapse: collapse; font: 12px var(--font-mono, ui-monospace, monospace); margin: 8px 0 0; }
  td, th { border: 1px solid var(--line); padding: 2px 8px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
</style>
</head>
<body>
<h1>Setup contact sheet</h1>
<p class="lead" id="lead">Loading fixtures…</p>
<div id="summary"></div>
<div id="out"></div>
<script type="module" src="./setups.js"></script>
</body>
</html>
