# Minimal Supabase CLI config for The Trade School.
# Project: pedcpgmowqhqgersxxqa (the-trade-school, us-east-1)
project_id = "the-trade-school"

[functions.create-checkout]
verify_jwt = true

[functions.customer-portal]
verify_jwt = true

# Stripe cannot send a Supabase JWT; the function verifies the Stripe signature instead.
[functions.stripe-webhook]
verify_jwt = false

# Public market data: browsers call it with the publishable key (not a JWT). Inputs are allow-listed.
[functions.market-data]
verify_jwt = false
