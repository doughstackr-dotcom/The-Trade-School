<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Trade School</title>
  <meta name="description" content="Learn trading fundamentals by playing: candlesticks, support and resistance, trend lines, chart patterns, Fibonacci, moving averages, indicators, multi-timeframe analysis and risk. Beginner and Advanced tracks with interactive lessons, games and simulations.">
  <meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <!-- Installable app (ARCHITECTURE §10): manifest, icons (rendered by scripts/render-icons.mjs), home-screen metas. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <meta name="application-name" content="The Trade School">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Trade School">
  <!-- "default": iOS draws an opaque status bar that follows light/dark; black-translucent would put white clock text over the light theme. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/chart.css">
  <link rel="stylesheet" href="css/account.css">

  <script>
    // Apply a saved theme before first paint (no flash). 'system' = no attribute.
    (function () {
      try {
        var t = localStorage.getItem('tts-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* storage blocked: follow the system theme */ }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>
    <div style="max-width:560px;margin:15vh auto;padding:24px;font-family:system-ui,sans-serif;line-height:1.5">
      <h1 style="font-size:28px">The Trade School needs JavaScript</h1>
      <p>The lessons, charts and games are drawn live in your browser. Please enable JavaScript and reload the page.</p>
    </div>
  </noscript>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
