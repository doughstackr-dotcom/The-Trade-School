  <script>
    // Apply saved theme and language before first paint. 'system' = no theme attribute.
    (function () {
      try {
        var t = localStorage.getItem('tts-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        if (localStorage.getItem('tts-language') === 'es') document.documentElement.lang = 'es';
      } catch (e) { /* storage blocked: follow the system theme */ }
    })();
  </script>
